name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  # ── 1. Create a draft release ───────────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v6

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Whisper Dictate ${tag}`,
              body: '## What\'s new\n\n<!-- Changelog here -->',
              draft: true,
              prerelease: false
            })
            return data.id

  # ── 2. Build artifacts (macOS + Windows in parallel) ───────────────────────
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # whisper.cpp takes ~20 min to compile; cache saves it on subsequent runs
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # Import the self-signed signing cert and TRUST it for code signing, so Tauri
      # can resolve it as a valid identity. tauri-action's built-in import does not
      # trust the cert, and Tauri rejects untrusted identities ("failed to resolve
      # signing identity"). We therefore set up the keychain ourselves here and only
      # hand APPLE_SIGNING_IDENTITY to tauri-action below.
      - name: Import & trust signing certificate (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain"
          P12="$RUNNER_TEMP/cert.p12"
          PEM="$RUNNER_TEMP/cert.pem"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security default-keychain -s "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -t 3600 -u "$KC"
          security import "$P12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KC"
          # Self-signed cert is untrusted by default; mark it as a trusted code-signing root.
          openssl pkcs12 -in "$P12" -clcerts -nokeys -legacy -passin pass:"$APPLE_CERTIFICATE_PASSWORD" -out "$PEM"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$PEM"
          security find-identity -v -p codesigning "$KC"
          rm -f "$P12" "$PEM"

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Self-signed identity imported & trusted in the previous step (macOS only;
          # empty/ignored on Windows). Gives the bundle a stable identity so TCC keeps
          # the mic grant across updates. Not notarized — Gatekeeper still warns once.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # audiopus_sys vendors a libopus whose CMakeLists declares a
          # cmake_minimum_required < 3.5; CMake 4.x (on the runners) refuses it
          # without this compatibility floor.
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        with:
          releaseId: ${{ needs.create-release.outputs.release-id }}
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

  # ── 3. Publish the draft once all platforms have built successfully ─────────
  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID),
              tag_name: tag,
              draft: false
            })
